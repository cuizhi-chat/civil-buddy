<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Civil Buddy</title>
  <meta name="theme-color" content="#0f766e" />
  <link rel="stylesheet" href="/static/styles.css?v=ui4" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">CB</span>
      <div>
        <strong>Civil Buddy</strong>
        <small>内部讨论草稿 · 不是签认件</small>
      </div>
    </div>
    <div class="top-meta">
      <span id="keyBadge" class="pill warn">检查 API Key…</span>
      <span class="pill quiet" id="modelBadge">模型未配置</span>
      <span class="pill quiet" id="harnessBadge">Harness steps</span>
      <span class="pill quiet" id="sandboxBadge">sandbox</span>
      <span class="pill quiet" id="approvalBadge">approval</span>
      <button type="button" id="navExperts" class="top-btn nav-btn" aria-controls="wall">岗位</button>
      <button type="button" id="navThreads" class="top-btn nav-btn" aria-controls="threadList">对话</button>
      <button type="button" id="navFiles" class="top-btn nav-btn" aria-controls="files">文件</button>
      <button type="button" id="openStudio" class="top-btn">知识库</button>
    </div>
  </header>
  <div id="scrim" class="scrim" aria-hidden="true"></div>

  <main class="layout">
    <aside class="rail">
      <p class="rail-lead">全企业任何人可问任意专家。提问不写盘；说「写一份」才出草稿。</p>
      <div class="thread-box">
        <div class="thread-head">
          <span>对话</span>
          <button type="button" id="btnNewThread" class="ghost tiny">新建</button>
          <button type="button" id="btnBg" class="ghost tiny">并行</button>
        </div>
        <div id="threadList"></div>
      </div>
      <input id="skillQ" class="skill-q" type="search" placeholder="搜索岗位…" autocomplete="off" />
      <button type="button" id="clearExperts" class="ghost">不指定岗位</button>
      <div id="wall"></div>
    </aside>

    <section class="stage">
      <div class="summon-bar" id="summonBar">当前：<em>未点名岗位</em> · 直接下任务即可</div>
      <div class="ctx-bar" id="ctxBar" data-zone="room">
        <div class="ctx-meter" aria-hidden="true"><i id="ctxFill"></i></div>
        <p class="ctx-text" id="ctxText"></p>
      </div>
      <div id="log" class="log">
        <p class="welcome">问一句，或写一份草稿。高风险成稿前勾选确认句。</p>
      </div>
      <form id="form" class="composer">
        <label class="confirm">
          <input type="checkbox" id="confirmOk" />
          我明白，将由持证人员签认
        </label>
        <textarea id="input" rows="3" placeholder="输入任务，例如：写临边专项方案讨论提纲"></textarea>
        <div class="local-row">
          <input id="localPath" type="text" placeholder="工作台电脑上的文件路径（不要填 D:\layout）" />
          <button type="button" id="btnLocal">导入</button>
          <button type="button" id="btnFirm">成套投标</button>
        </div>
        <div id="attaches" class="attaches"></div>
        <div class="row">
          <div class="hints">
            <input type="file" id="filePick" hidden multiple accept=".pdf,.docx,.xlsx,.txt,.md,.csv,.json" />
            <button type="button" id="btnUpload">上传</button>
            <button type="button" data-fill="什么是 GST">GST</button>
            <button type="button" data-fill="临边防护算不算危大？要不要专家论证？">危大</button>
            <button type="button" data-fill="按虚构滨河路人行道维修，写临边与洞口防护专项方案讨论提纲。高度未提供。">施工方案</button>
            <button type="button" data-fill="把临边防护编成工友班前三分钟白话。">白话</button>
            <button type="button" data-fill="从下面这段招标里抽出评分点和必须编制的专项：某市政人行道维修，要求编制高处作业/临边专项方案，技术标 40 分。">招标</button>
          </div>
          <div class="send-row">
            <button type="button" id="stop" class="stop hidden">停止</button>
            <button type="submit" id="send">发送</button>
          </div>
        </div>
      </form>
    </section>

    <aside class="side">
      <h2>依据</h2>
      <ul id="cites"></ul>
      <h2>文件 <small class="muted-inline">下载 / 预览 · 断流后切回本对话仍可见</small></h2>
      <ul id="files"></ul>
      <h2>本岗库</h2>
      <ul id="kblist"></ul>
    </aside>
  </main>

  <div id="studio" class="studio hidden" aria-hidden="true">
    <div class="studio-head">
      <div>
        <strong>专家与知识库工作室</strong>
        <small id="studioTotal">总库 —</small>
      </div>
      <button type="button" id="closeStudio" class="top-btn">回到对话</button>
    </div>
    <div class="studio-grid">
      <div class="studio-nav">
        <label class="limit-row">单岗知识软上限
          <input type="number" id="softLimit" min="8" max="8192" /> KB
          <button type="button" id="saveLimit">保存</button>
        </label>
        <p class="muted">超限仍可编辑，只是标红。单篇硬顶 512 KB。左侧是中文篇名，悬停看路径。</p>
        <div class="studio-actions">
          <button type="button" id="btnNewCat">新建大类</button>
          <button type="button" id="btnNewExp">新建专家</button>
          <button type="button" id="btnNewFile">新建文件</button>
          <button type="button" id="btnDelFile">删除当前文件</button>
        </div>
        <div id="studioTree"></div>
      </div>
      <div class="studio-main">
        <form id="expertForm" class="expert-form">
          <div class="form-row">
            <label>内部编号（路径用，界面不展示） <input name="id" required placeholder="soil-lab" /></label>
            <label>岗位中文名 <input name="name" required placeholder="试验室" /></label>
            <label>大类
              <select name="category" id="expCat"></select>
            </label>
            <label>风险
              <select name="risk">
                <option value="low">低</option>
                <option value="high">高（写盘需确认）</option>
              </select>
            </label>
          </div>
          <label>职责 <input name="title" placeholder="这个专家独立完成什么" /></label>
          <label>默认交付 <input name="delivers" placeholder="例如：试验计划草稿" /></label>
          <label>别名（逗号分隔） <input name="aliases" placeholder="试验, 土工" /></label>
          <div class="form-row">
            <button type="submit">保存专家</button>
            <button type="button" id="btnDelExp">停用 / 删除此专家</button>
          </div>
        </form>
        <div class="editor-meta">
          <span id="filePath">未打开文件</span>
          <span id="fileSize"></span>
          <button type="button" id="saveFile" disabled>保存文件</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="在左侧点开一篇。同部门专家读大类共享；只有被召唤的这位专家先读本岗知识。"></textarea>
      </div>
    </div>
  </div>
  <script src="/static/app.js?v=ui4"></script>
  <script src="/static/studio.js?v=ui4"></script>
</body>
</html>
